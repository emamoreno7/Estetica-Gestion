name: Amore Phase 2 - Responsive WebP
on:
  push:
    branches: [redesign/amore-phase2]
    paths:
      - 'scripts/optimize-responsive-images.py'
      - '.github/workflows/amore-responsive-assets.yml'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: amore-phase2-responsive
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/amore-phase2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - run: python scripts/optimize-responsive-images.py
      - name: Validar catálogo y comparadores
        run: |
          test $(find public/editorial -maxdepth 1 -name '*-240.webp' | wc -l) -eq 12
          test $(find public/editorial -maxdepth 1 -name '*-480.webp' | wc -l) -eq 12
          test $(find public/casos -maxdepth 1 -name '*-480.webp' | wc -l) -eq 8
          test $(find public/casos -maxdepth 1 -name '*-800.webp' | wc -l) -eq 8
          test -s public/editorial/amore-mark-144.webp
      - name: Guardar derivados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/editorial/*-240.webp public/editorial/*-480.webp
          git add public/editorial/amore-mark-96.webp public/editorial/amore-mark-144.webp
          git add public/casos/*-480.webp public/casos/*-800.webp
          if ! git diff --cached --quiet; then
            git commit -m 'assets: derivados WebP responsive para móvil y escritorio'
            git pull --rebase origin redesign/amore-phase2
            git push origin HEAD:redesign/amore-phase2
          fi
