name: Amore — Optimizar fotografía editorial

on:
  push:
    branches: [redesign/amore-premium]
    paths:
      - 'scripts/optimize-editorial-images.py'
      - 'public/*.png'
      - '.github/workflows/amore-optimize-images.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    if: github.repository == 'emamoreno7/Estetica-Gestion'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/amore-premium
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Generar fotografías WebP
        run: python scripts/optimize-editorial-images.py
      - name: Publicar assets optimizados en la rama del PR
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/editorial/
          if ! git diff --cached --quiet; then
            git commit -m 'assets: optimizar imágenes editoriales WebP'
            git push origin HEAD:redesign/amore-premium
          else
            echo "Los WebP ya están actualizados."
          fi
