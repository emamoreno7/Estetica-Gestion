name: Amore Mediciones y evolucion
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/features/mediciones/**'
      - 'src/features/admin/ClienteDrawer.tsx'
      - 'src/features/auth/ClientLoginForm.tsx'
      - 'src/App.tsx'
      - 'supabase/migrations/*mediciones*'
      - 'scripts/test-mediciones.mjs'
      - 'scripts/test-mediciones-sql.py'
      - 'scripts/sql/mediciones-fixture.sql'
      - '.github/workflows/amore-mediciones-checks.yml'
  push:
    branches: [feature/amore-mediciones-historicas]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Pruebas unitarias
        run: node scripts/test-mediciones.mjs
      - name: TypeScript estricto
        run: npx tsc --noEmit
      - name: Build Vite
        run: npm run build
      - name: Build GitHub Pages
        run: npm run build:pages

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: amore_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amore_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres_test@localhost:5432/amore_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Entorno sintético de Auth y fichas
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/sql/mediciones-fixture.sql
      - name: Migración real
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260923213000_mediciones_corporales.sql
      - name: Idempotencia de migración
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260923213000_mediciones_corporales.sql
      - name: Probar RLS y auditoría
        run: |
          python -m pip install --disable-pip-version-check "psycopg[binary]==3.2.10"
          python scripts/test-mediciones-sql.py
